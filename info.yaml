# Tiny Tapeout project information
project:
  title:        "TinyCalc 8-bit integer calculator"      # Project title
  author:       "SkyPiggy8"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Area-oriented add/subtract/multiply/divide calculator"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     100000       # Clock frequency in Hz (or 0 if not applicable)

  # SKY130 1x1 target: 161.00 x 111.52 um in pinned tt-support-tools.
  # Final fit must pass the selected shuttle's GDS/precheck flow.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_skypiggy8_tinycalc"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "operand data bit 0"
  ui[1]: "operand data bit 1"
  ui[2]: "operand data bit 2"
  ui[3]: "operand data bit 3"
  ui[4]: "operand data bit 4"
  ui[5]: "operand data bit 5"
  ui[6]: "operand data bit 6"
  ui[7]: "operand data bit 7"

  # Outputs
  uo[0]: "result byte bit 0"
  uo[1]: "result byte bit 1"
  uo[2]: "result byte bit 2"
  uo[3]: "result byte bit 3"
  uo[4]: "result byte bit 4"
  uo[5]: "result byte bit 5"
  uo[6]: "result byte bit 6"
  uo[7]: "result byte bit 7"

  # Bidirectional pins
  uio[0]: "LOAD_A"
  uio[1]: "LOAD_B"
  uio[2]: "START"
  uio[3]: "OP bit 0"
  uio[4]: "OP bit 1"
  uio[5]: "RESULT_HIGH"
  uio[6]: "BUSY output"
  uio[7]: "DIVZERO output"

# Do not change!
yaml_version: 6
