pinout:
  ui[0]: "Calculator input data bit 0"
  ui[1]: "Calculator input data bit 1"
  ui[2]: "Calculator input data bit 2"
  ui[3]: "Calculator input data bit 3"
  ui[4]: "Calculator input data bit 4"
  ui[5]: "Calculator input data bit 5"
  ui[6]: "Calculator input data bit 6"
  ui[7]: "Calculator input bit 7 / read upper result bits"
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC"
  uio[0]: "LOAD_A (shared command/result bus)"
  uio[1]: "LOAD_B (shared command/result bus)"
  uio[2]: "START (shared command/result bus)"
  uio[3]: "OP0 (shared command/result bus)"
  uio[4]: "OP1 (shared command/result bus)"
  uio[5]: "RESULT_HIGH_BYTE (shared command/result bus)"
  uio[6]: "RESULT_BIT76 (shared command/result bus)"
  uio[7]: "STATUS_OR_DATA76 (shared command/result bus)"
