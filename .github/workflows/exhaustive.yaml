name: exhaustive generic-gate verification
on: [push, workflow_dispatch]
jobs:
  exhaustive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y yosys g++
      - run: mkdir -p build && yosys -s scripts/synth.ys > build/synth.log && python scripts/gate_test.py
      - uses: actions/upload-artifact@v7
        with:
          name: exhaustive-verification
          path: build/verification.txt
