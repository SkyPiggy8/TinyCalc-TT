name: mascot RTL synthesis check
on: [push, workflow_dispatch]
jobs:
  synthesis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Read and synthesize current VGA top
        run: |
          mkdir -p build
          yosys -p 'read_verilog src/project.v; hierarchy -check -top tt_um_skypiggy8_nailong; synth -top tt_um_skypiggy8_nailong; stat' | tee build/synthesis.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mascot-rtl-synthesis
          path: build/synthesis.txt
